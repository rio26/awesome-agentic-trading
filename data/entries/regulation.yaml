# Entries for the `regulation` section. Fields are documented in CONTRIBUTING.md.

- name: CFTC Electronic Trading Risk Principles (final rule)
  url: https://www.cftc.gov/LawRegulation/FederalRegister/finalrules/2020-27622.html
  section: regulation
  description: 2020 principles-based rule (replacing the withdrawn Regulation AT) requiring designated contract markets to adopt rules and pre-trade risk controls that limit disruptions from electronic trading and to notify the CFTC of significant disruptions.
  year: 2020
  added: '2026-10-28'
- name: ESMA Supervisory Briefing on Algorithmic Trading
  url: https://www.esma.europa.eu/press-news/esma-news/esma-issues-supervisory-briefing-algorithmic-trading
  section: regulation
  description: February 2026 non-binding briefing giving EU national regulators common expectations on pre-trade controls, governance, testing and outsourcing under MiFID II, and adding considerations for supervising the use of AI in algorithmic trading.
  year: 2026
  added: '2026-10-28'
- name: FCA - Algorithmic Trading Compliance in Wholesale Markets
  url: https://www.fca.org.uk/publications/multi-firm-reviews/algorithmic-trading-compliance-wholesale-markets
  section: regulation
  description: 2018 UK FCA multi-firm review setting out good and poor practice in five areas - defining algorithmic trading, development and testing, risk controls, governance and oversight, and market conduct.
  year: 2018
  added: '2026-10-28'
- name: FINRA 2026 Regulatory Oversight Report - GenAI and AI agents
  url: https://www.finra.org/rules-guidance/guidance/reports/2026-finra-annual-regulatory-oversight-report/gen-ai
  section: regulation
  description: December 2025 section that for the first time addresses AI agents, naming autonomy without human approval, scope creep beyond user intent, auditability of multi-step reasoning, data sensitivity and poorly designed reward functions as risks, and asking firms to decide where humans stay in the loop.
  year: 2025
  added: '2026-10-28'
- name: FINRA Regulatory Notice 15-09 - Algorithmic Trading Supervision and Control
  url: https://www.finra.org/rules-guidance/notices/15-09
  section: regulation
  description: 2015 FINRA guidance on effective supervision and control practices for firms running algorithmic strategies, covering risk assessment, code development, testing and validation, trading-system controls and compliance.
  year: 2015
  added: '2026-10-28'
- name: MiFID II RTS 6 - Commission Delegated Regulation (EU) 2017/589
  url: https://eur-lex.europa.eu/eli/reg_del/2017/589/oj
  section: regulation
  description: EU regulatory technical standard on organisational requirements for investment firms engaged in algorithmic trading, mandating pre-deployment testing in non-production environments, kill functionality, pre-trade controls (price collars, order and message limits), annual self-assessment and five-year records.
  year: 2017
  added: '2026-10-28'
- name: SEC Division of Examinations FY2026 Priorities
  url: https://www.sec.gov/files/2026-exam-priorities.pdf
  section: regulation
  description: November 2025 priorities stating examiners will review the accuracy of firms' AI-related representations and whether policies, controls and human oversight adequately supervise automated advisory tools and trading algorithms.
  year: 2025
  added: '2026-10-28'
