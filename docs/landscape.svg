<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff" rx="12"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">The agentic trading pipeline</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#656d76">Each section of the list maps to one box. Risk wraps everything; evaluation sits underneath.</text>

  <!-- Risk envelope -->
  <rect x="28" y="84" width="904" height="196" rx="14" fill="#fff5f5" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="106" font-size="13" font-weight="600" fill="#c62828">RISK &amp; GUARDRAILS</text>
  <text x="48" y="124" font-size="11.5" fill="#8a3b3b">position limits · kill switch · pre-trade checks · prompt-injection defence · regulation</text>

  <!-- Data -->
  <rect x="60" y="146" width="240" height="112" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="180" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1f3f8a">DATA &amp; RESEARCH</text>
  <text x="180" y="194" text-anchor="middle" font-size="11.5" fill="#2f4a7a">prices · fundamentals · filings · news</text>
  <text x="180" y="212" text-anchor="middle" font-size="11.5" fill="#2f4a7a">MCP servers for market data</text>
  <text x="180" y="238" text-anchor="middle" font-size="11" fill="#6b7a99">what the agent can see</text>

  <!-- Decision -->
  <rect x="360" y="146" width="240" height="112" rx="10" fill="#f1fbf3" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="480" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1d5c36">DECISION</text>
  <text x="480" y="194" text-anchor="middle" font-size="11.5" fill="#2f5e42">LLM trading agents · multi-agent firms</text>
  <text x="480" y="212" text-anchor="middle" font-size="11.5" fill="#2f5e42">prediction-market agents · skills</text>
  <text x="480" y="238" text-anchor="middle" font-size="11" fill="#6b8a74">how it decides</text>

  <!-- Execution -->
  <rect x="660" y="146" width="240" height="112" rx="10" fill="#fff8ec" stroke="#d98b14" stroke-width="1.5"/>
  <text x="780" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#7a4a04">EXECUTION</text>
  <text x="780" y="194" text-anchor="middle" font-size="11.5" fill="#7a5a2a">broker &amp; exchange MCP servers · SDKs</text>
  <text x="780" y="212" text-anchor="middle" font-size="11.5" fill="#7a5a2a">paper first, then live</text>
  <text x="780" y="238" text-anchor="middle" font-size="11" fill="#9a8260">how it trades</text>

  <!-- Arrows between boxes -->
  <line x1="300" y1="202" x2="358" y2="202" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="202" x2="658" y2="202" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Evaluation -->
  <rect x="60" y="306" width="840" height="86" rx="10" fill="#f6f1fb" stroke="#7c4dbd" stroke-width="1.5"/>
  <text x="480" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#4a2a7a">EVALUATION</text>
  <text x="480" y="354" text-anchor="middle" font-size="11.5" fill="#5a4a7a">backtesting engines · paper-trading sandboxes · live arenas &amp; leaderboards</text>
  <text x="480" y="374" text-anchor="middle" font-size="11" fill="#8a7aa9">how you know it works, and the public record of when it did not (incidents)</text>

  <!-- Feedback arrows from evaluation up to decision and execution -->
  <line x1="480" y1="306" x2="480" y2="262" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="780" y1="306" x2="780" y2="262" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
