name: weekly scout and stale check

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Refresh metadata and flag stale entries
        run: python scripts/check_stale.py --report stale.md

      - name: Scout for new and rising repositories
        run: python scripts/scout.py --days 7 --min-stars 20 --report scout.md

      - name: Check external links
        run: python scripts/check_links.py --report links.md

      - name: Regenerate README and section pages with fresh metadata
        run: python scripts/build_readme.py

      - name: Commit metadata and README if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata.json README.md README.zh-CN.md sections/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "weekly: refresh metadata"
            git push
          fi

      - name: Open the weekly report issue
        run: |
          title="Weekly report $(date -u +%F)"
          { cat scout.md; echo; cat stale.md; echo; cat links.md; } > report.md
          gh issue create --title "$title" --body-file report.md --label weekly-report \
            || gh issue create --title "$title" --body-file report.md
